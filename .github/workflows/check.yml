# The manifests, the Markdown, and no em dash. A shared workflow may replace it later.
name: check

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Validate the plugin and the marketplace
        run: |
          npx --yes @anthropic-ai/claude-code@2.1.326 plugin validate .
          npx --yes @anthropic-ai/claude-code@2.1.326 plugin validate .claude-plugin/marketplace.json
      - name: Lint the Markdown
        uses: DavidAnson/markdownlint-cli2-action@696eb3f2509270d7b882d2aa68347bc676e7af34 # v25.0.0
        with:
          globs: "**/*.md"
      - name: No em dash
        run: |
          if grep -rnF --exclude-dir=.git "$(printf '\342\200\224')" .; then
            echo "em dash found: use a comma, a colon, parentheses or two sentences" >&2
            exit 1
          fi
